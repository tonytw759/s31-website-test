name: S31 網站自動化測試

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 下載測試程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝測試工具
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: 執行公開網站及登入驗證
        env:
          S31_TEST_USERNAME: ${{ secrets.S31_TEST_USERNAME }}
          S31_TEST_PASSWORD: ${{ secrets.S31_TEST_PASSWORD }}
        run: |
          python test_s31.py --browser --url https://ssss31.netlify.app/

      - name: 儲存測試結果與截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S31-login-test-results
          path: |
            s31_qa_report.json
            s31_mobile.png
            s31_desktop.png
          if-no-files-found: warn
